services:
  postgres:
    image: postgres:16
    container_name: datalang-postgres
    environment:
      POSTGRES_USER: datalang
      POSTGRES_PASSWORD: datalang
      POSTGRES_DB: datalang_dev
    ports:
      - "5432:5432"
    volumes:
      - datalang-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalang -d datalang_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datalang-postgres-data:
